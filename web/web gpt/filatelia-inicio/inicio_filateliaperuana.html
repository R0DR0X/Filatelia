<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Filatelia Peruana - La primera tienda filatélica online del Perú">
  <title>Filatelia Peruana - Inicio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: #fff;
    }
    header {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background-color: #111;
    }
    header img {
      height: 40px;
    }
    .hero {
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('biblioteca-hd.png') no-repeat center center/cover;
      padding: 80px 20px;
      text-align: center;
    }
    .hero h1 {
      font-size: 28px;
      color: #fff;
      margin: 0;
    }
    .section-title {
      text-align: center;
      font-size: 24px;
      color: #ffcc00;
      margin: 40px 0 20px;
    }
    .trending {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 0 20px 40px;
    }
    .box {
      flex: 1 1 300px;
      background-size: cover;
      background-position: center;
      height: 200px;
      position: relative;
      border: 1px solid #333;
    }
    .box .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: white;
      font-weight: bold;
    }
    .counter {
      text-align: center;
      font-size: 22px;
      margin: 40px 0;
    }
    .banner-final {
      width: 100%;
      display: block;
      margin-top: 40px;
    }
    footer {
      text-align: center;
      font-size: 14px;
      color: #aaa;
      padding: 20px;
      background-color: #111;
    }
  </style>
</head>
<body>
  <header>
    <img src="logo-s (1).png" alt="Logo Miedzianogora">
  </header>

  <section class="hero">
    <h1>Bienvenidos A La Primera Tienda Filatélica Del Perú Online</h1>
  </section>

  <div class="section-title">Productos en Tendencia</div>
  <section class="trending">
    <div class="box" style="background-image: url('BANNER ESTAMPILLAS.JPG');">
      <div class="overlay">Estampillas</div>
    </div>
    <div class="box" style="background-image: url('ACCESORIOS.jpg');">
      <div class="overlay">Accesorios</div>
    </div>
  </section>

  <div class="counter">
    Visitantes totales: <span id="contador">12,345</span>
  </div>

  <img src="BANNER 2.JPG" alt="Banner final" class="banner-final">

  <footer>
    &copy; 2025 Filatelia Peruana – Todos los derechos reservados.
  </footer>
</body>
</html>

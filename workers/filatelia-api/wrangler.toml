name = "filatelia-api"
main = "src/index.ts"
compatibility_date = "2024-04-03"

[vars]
SUPABASE_URL = "https://tshatwvvkworsogjfjyj.supabase.co"
# JWT_SECRET removed (2026-08): the Worker no longer authenticates identities
# itself; the Next app is the sole session authority (see
# openspec/changes/unified-session). This value was committed in plaintext
# and must be treated as COMPROMISED — see the deployment runbook in
# openspec/changes/unified-session/tasks.md for the required operator
# rotation/removal steps on the deployed Worker.

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "filatelia-db"
database_id = "a06f77b8-6826-4594-8bee-48018e637e01"

# Cloudflare Vectorize Index binding
[[vectorize]]
binding = "VECTORIZE"
index_name = "stamps-index"

# Cloudflare Workers AI binding
[ai]
binding = "AI"


# Bindings for R2 Buckets (Images, Thumbs, Backs)
[[r2_buckets]]
binding = "STAMPS_IMAGES"
bucket_name = "stamps-images"

[[r2_buckets]]
binding = "STAMPS_THUMBS"
bucket_name = "stamps-thumbs"

[[r2_buckets]]
binding = "STAMPS_BACKS"
bucket_name = "stamps-backs"

# Rate limit binding for the public, unauthenticated POST /analytics/visit
# endpoint (see the comment above `checkAnalyticsRateLimit` in src/index.ts
# for the limit/key rationale). `namespace_id` only needs to be unique within
# this account; there is no other `[[ratelimits]]` entry in this repo yet, so
# "1" is free.
[[ratelimits]]
name = "ANALYTICS_LIMITER"
namespace_id = "1"
simple = { limit = 60, period = 60 }
